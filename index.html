<meta charset="utf-8">
<title>Orbit Mission Atlas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
  :root{
    --void:#060911; --rail:#0a0f1c; --edge:#1b2740; --track:#131c30;
    --ink:#e8edf5; --ink-2:#9dabc2; --muted:#6b7a95;
    --drift:#ff8a3d; --target:#53d3ff; --burn:#ffd447; --grey:#3d4b66; --wing:#c084fc;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:"Saira Condensed","IBM Plex Sans",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--ink);font-family:var(--mono);
       font-size:12px;line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2{font-family:var(--disp);margin:0;letter-spacing:.01em}
  button,select{font-family:var(--mono)}

  /* One screen: header / arms / stage / timeline. Nothing scrolls but the rail. */
  .app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;
       height:100dvh;padding:12px 14px;max-width:2100px;margin:0 auto;overflow:hidden}
  @media(max-width:860px),(max-height:560px){.app{height:auto;grid-template-rows:none;overflow:visible}}

  /* The header is one fixed-height row on every tab: tabs differ in how many figures and how long an
     eyebrow they carry, and a wrapping header changed height between tabs, moving everything below it
     (PH 2026-09-30). Nothing wraps; what does not fit is clipped, never reflowed. */
  header{display:flex;align-items:baseline;gap:22px;flex-wrap:nowrap;height:68px;min-height:68px;overflow:hidden;
         padding-bottom:8px;border-bottom:1px solid var(--edge)}
  .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--drift);margin:0;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header>div:first-child{min-width:0;flex:1 1 auto}
  h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  h1{font-size:clamp(19px,2.1vw,27px);font-weight:700;line-height:1;margin-top:2px}
  .figs{display:flex;gap:20px;margin-left:auto;align-items:baseline;flex:none;white-space:nowrap}
  .fig{display:flex;flex-direction:column;gap:0}
  .fig b{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.05;
         font-variant-numeric:tabular-nums}
  /* The clock is rewritten every frame. Anything whose WIDTH changes there drags the rest of the
     header with it sixty times a second, which reads as the whole page shivering. Monospaced, a
     fixed character count, and a reserved box, so the digits change and nothing else moves. */
  .fig.clock b,.fig.utc b{font-family:var(--mono);font-weight:500;white-space:pre;
                          font-variant-numeric:tabular-nums}
  .fig.clock,.fig.clock b{min-width:104px}
  .fig.utc,.fig.utc b{min-width:150px}
  .fig span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .fig.clock b{color:var(--burn)}

  .arms{display:flex;gap:2px;border:1px solid var(--edge);border-radius:3px;padding:2px;
        background:var(--rail);width:fit-content;max-width:100%;flex-wrap:wrap}
  .arms button{border:0;background:transparent;border-radius:2px;padding:5px 14px;cursor:pointer;
               font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.02em;
               color:var(--ink-2)}
  .arms button[aria-pressed="true"]{background:#16233c;color:var(--drift)}
  .arms button:disabled{opacity:.35;cursor:not-allowed}
  .arms button:hover:not(:disabled){color:var(--ink)}

  main{display:grid;grid-template-columns:286px minmax(0,1fr);gap:12px;min-height:0}
  @media(max-width:1060px){main{grid-template-columns:1fr}}
  .rail{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;
        scrollbar-width:thin;padding-right:2px}
  .panel{background:var(--rail);border:1px solid var(--edge);border-radius:3px;padding:8px 10px;
         flex:none}
  .panel h2{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
            color:var(--muted);margin-bottom:6px;font-family:var(--mono);
            display:flex;justify-content:space-between;gap:8px}
  .kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0;font-size:11.5px}
  .kv dt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .kv dd.hi{color:var(--drift)}
  .warn{border-left:2px solid var(--burn);padding-left:9px;color:var(--ink-2);font-size:11px;
        line-height:1.5;margin:0}
  /* the inset never changes size, whatever it draws */
  .inset{margin:0;flex:none;background:var(--rail);border:1px solid var(--edge);border-radius:3px;
         padding:8px 10px 7px;height:232px;display:flex;flex-direction:column}
  .inset figcaption{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
                    height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inset svg{width:100%;height:190px;display:block;margin-top:2px}
  .inset .note{font-size:10px;color:var(--muted);height:16px;display:flex;
               justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden}
  /* the engine line is rewritten while the clock runs: one line each, fixed height, never reflows */
  .eng{margin:0;font-size:11.5px;white-space:pre;overflow:hidden;text-overflow:ellipsis;height:17px;
       color:var(--ink-2);font-variant-numeric:tabular-nums}
  .eng.on{color:var(--burn);font-weight:500}
  .eng.sub{font-size:10.5px;color:var(--muted);height:16px}
  /* instruments: fixed monospaced boxes, rewritten live; nothing here may change width */
  .ig{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
  .ib{display:flex;flex-direction:column;min-width:0}
  .ib span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);height:12px;white-space:nowrap}
  .ib b{font-family:var(--mono);font-weight:500;font-size:13px;line-height:1.2;height:16px;white-space:pre;
        overflow:hidden;font-variant-numeric:tabular-nums;color:var(--ink)}
  .ib b.hi{color:var(--burn)} .ib b.on{color:var(--burn)} .ib.wide{grid-column:1/-1}
  .ib b.ko-ok{color:var(--ink-2)} .ib b.ko-amber{color:var(--burn)} .ib b.ko-red{color:var(--drift);font-weight:700}
  .evlog{display:flex;flex-direction:column;gap:2px;font-size:10.5px}
  .evr{display:grid;grid-template-columns:82px 1fr;gap:8px;padding:2px 4px;border-radius:2px;cursor:pointer;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .evr b{font-weight:500;color:var(--ink);white-space:pre}
  .evr.past{color:var(--muted)} .evr.past b{color:var(--muted)}
  .evr.next b{color:var(--burn)}
  .evr:hover{background:#16233c}
  .ledger{display:flex;flex-direction:column;gap:5px;font-size:11px}
  .bar-row{display:grid;grid-template-columns:58px 1fr 78px;gap:8px;align-items:center}
  .bar-row i{font-style:normal;color:var(--muted)}
  .bar-row em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .bar-row em b{color:var(--ink);font-weight:500}
  .rail-track{background:var(--track);height:7px;border-radius:1px;position:relative;overflow:hidden}
  .rail-track s{position:absolute;inset:0;text-decoration:none;opacity:.18}
  .rail-track u{position:absolute;top:0;bottom:0;left:0;text-decoration:none}

  .view{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;min-height:0}
  /* nothing is ever drawn over the globe */
  .globe{border:1px solid var(--edge);border-radius:3px;overflow:hidden;
         background:radial-gradient(120% 90% at 50% 40%,#0a1324 0%,#060911 70%);min-height:0}
  #sky{display:block;width:100%;height:100%}
  @media(max-width:860px),(max-height:560px){.globe{height:58vh}}
  .ctlbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ctlbar .spacer{margin-left:auto}
  .key{color:var(--muted);font-size:10.5px;white-space:nowrap}
  .key i{display:inline-block;width:14px;height:2px;margin:0 5px 0 12px;vertical-align:middle}
  button.ctl,.sel{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
       background:#101a2e;color:var(--ink);border:1px solid var(--edge);border-radius:2px;
       padding:5px 10px;cursor:pointer}
  button.ctl:hover{border-color:var(--drift);color:var(--drift)}
  button.ctl[aria-pressed="true"]{background:var(--drift);border-color:var(--drift);color:#1a0d03}
  button.ctl:focus-visible,.sel:focus-visible{outline:2px solid var(--target);outline-offset:1px}
  .sel{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);padding:0 6px 0 9px;
       text-transform:none}
  .sel select{font-size:10.5px;background:transparent;color:var(--ink);border:0;padding:5px 2px;
              cursor:pointer}
  .sel option{background:#101a2e;color:var(--ink)}

  footer{display:flex;flex-direction:column;gap:4px;min-height:0}
  .tlwrap{border:1px solid var(--edge);border-radius:3px;background:var(--rail);height:132px;
          position:relative}
  .tlwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
  .tltabs{position:absolute;right:8px;top:6px;display:flex;gap:4px}
  .tltabs button{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;background:#101a2e;
                 color:var(--ink-2);border:1px solid var(--edge);border-radius:2px;padding:3px 8px;
                 cursor:pointer}
  .tltabs button[aria-pressed="true"]{color:var(--drift);border-color:var(--drift)}
  details{color:var(--muted);font-size:10.5px;overflow:auto;max-height:26vh}
  details summary{cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:9.5px}
  details p{margin:5px 0 0;line-height:1.6;max-width:160ch}
  details b{color:var(--ink-2);font-weight:500}
  /* v34: the header carries a loading line while a tab's files are fetched, and a DEV banner when the
     manifest says the data are development stand-ins */
  .loadline{font-size:10px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;min-height:14px}
  .loadline.err{color:var(--drift)}
  .devtag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#1a0d03;background:var(--burn);
          border-radius:2px;padding:2px 7px;white-space:nowrap}
  .arms button.wingsel{color:var(--wing)}
</style>

<div class="app">
  <header>
    <div>
      <p class="eyebrow" id="eyebrow">&mdash;</p>
      <h1 id="title">Orbit Mission Atlas</h1>
      <div class="loadline" id="loadline">loading manifest…</div>
    </div>
    <div class="figs" id="figs"></div>
    <div class="figs">
      <span class="devtag" id="devtag" hidden></span>
      <div class="fig clock"><b id="c-day">&mdash;</b><span>mission day</span></div>
      <div class="fig utc"><b id="c-utc" style="font-size:15px">&mdash;</b><span id="c-sub">utc</span></div>
    </div>
  </header>

  <nav class="arms" id="arms" aria-label="Mission architecture"></nav>

  <main>
    <aside class="rail" id="rail">
      <figure class="inset">
        <figcaption id="inset-cap">Encounter geometry</figcaption>
        <svg id="enc" viewBox="0 0 280 200" preserveAspectRatio="xMidYMid meet" role="img"
             aria-label="Relative geometry of the two satellites at the selected encounter"></svg>
        <div class="note"><span id="enc-l">&mdash;</span><span id="enc-r">&mdash;</span></div>
      </figure>
      <section class="panel"><h2><span id="sel-title">Encounter</span><span id="sel-of"></span></h2>
        <dl class="kv" id="sel-kv"></dl></section>
      <div id="armpanel"></div>
    </aside>

    <section class="view">
      <div class="globe"><canvas id="sky"></canvas></div>
      <div class="ctlbar" id="controls"></div>
    </section>
  </main>

  <footer>
    <div class="tlwrap">
      <svg id="tl" viewBox="0 0 1400 132" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="Mission timeline"></svg>
      <div class="tltabs" id="tltabs"></div>
    </div>
    <details><summary>provenance</summary><p id="prov"></p></details>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el=function(id){return document.getElementById(id);};
  var fmt=function(x,n){return Number(x).toFixed(n===undefined?2:n);};
  var hm=function(s){s=Math.round(s);return s<3600?Math.round(s/60)+" min":(s/3600).toFixed(1)+" h";};
  var km=function(x){return x<1?(x*1000).toFixed(0)+" m":x<100?x.toFixed(2)+" km":Math.round(x)+" km";};
  var TAU=Math.PI*2, RE=6378.137, U=1000;
  var wrap=function(x){return x-TAU*Math.floor(x/TAU);};          // into [0, 2pi)
  /* Shortest signed arc. NOT ((x+3pi) % 2pi) - pi: the remainder operator keeps the sign of its
     left operand, so that form silently returns the WRONG branch as soon as |x| > 3pi -- which is
     every multi-revolution phase difference in this page, and was why bodies lurched at a
     boundary and the clock looked like it skipped. */
  var arc=function(x){return x-TAU*Math.round(x/TAU);};
  /* v34: payloads are separate files listed in manifest.json and fetched when a tab is first
     activated. load(id) keeps its v33 meaning -- "the payload with this id" -- so a gate can still
     feed a payload by id: the store first (fetch or a gate's feed()), then an element of that id. */
  var PAY={};
  function feed(id,obj){PAY[id]=obj;}
  function load(id){
    if(PAY[id]!==undefined)return PAY[id];
    var n=el(id); if(!n)return null;
    var t=(n.textContent||"").trim();
    if(!t||t==="null")return null;
    try{return JSON.parse(t);}catch(e){return null;}
  }
  /* Four tabs from the manifest. DATA[k] is the tab's ARM payload (meta.kind survey / hybrid / fleet);
     INSP[k] the SET of per-inspector tour payloads drawn on top of it (the fleet's own inspectors on
     the fleet tabs, the co-orbit WING on the survey and drifter tabs); WING[k] the wing's fleet-level
     events file (its meta feeds the "Co-orbit wing" panel). */
  var MAN=null,TABS=[],TAB={},DATA={},INSP={},WING={},LOADED={},CAT=null,CUR=null;

  /* ====================================================================================
     ONE CLOCK.  T is mission days since the common epoch every arm's records are stamped
     against.  It advances from the WALL clock, so a heavy frame costs picture and never
     time, and changing the rate re-anchors without a jump.  Every single thing drawn --
     the Earth's spin, the Sun, each inspector, each target, all 7852 catalogue satellites
     -- is a pure function of T.  There is no second time source anywhere in this page.
     ==================================================================================== */
  var EPOCH="2026-03-25T21:25:17.146",EPOCH_MS=Date.parse(EPOCH+"Z");
  var CLK={T:0,rate:3600,playing:true,t0:0,w0:0,lo:0,hi:1825};
  /* STATE CARRIED ACROSS TABS (PH 2026-10-02): the clock (T, play, rate) lives in CLK; the platform selection is a
     MODE ("" own platforms / "*" all platforms incl. the S1 arm) plus, when one was chosen by name, that platform;
     the constellation layer and the timeline/coverage sub-tab are remembered here. Every control of a newly built
     tab is rendered FROM these, so the selectors show the carried value. */
  var SEL={mode:"",who:null}, SHOWCAT=false, SUBTAB="tl";
  function now(){
    return (window.performance&&window.performance.now)?window.performance.now():Date.now();
  }
  function anchor(T){CLK.T=T;CLK.t0=T;CLK.w0=now();}
  function advance(){
    if(!CLK.playing)return;
    CLK.T=CLK.t0+(now()-CLK.w0)/1000*CLK.rate/86400;
    if(CLK.T>CLK.hi||CLK.T<CLK.lo)anchor(CLK.lo);
  }
  function tOf(utc){return (Date.parse(String(utc).replace(" ","T")+"Z")-EPOCH_MS)/86400000;}
  function utcAt(T){
    var d=new Date(EPOCH_MS+T*86400000),p=function(x){return (x<10?"0":"")+x;};
    return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+
           p(d.getUTCHours())+":"+p(d.getUTCMinutes());
  }
  /* Earth spin: ONE line through Orekit's prime-meridian direction, least-squares fitted
     over the whole mission (catalogue_payload.py).  Continuous by construction -- there is
     no per-encounter anchor left to re-base on, so no rotation is skipped or repeated.
     Gate: meta.spin_gate_deg against Orekit, meta.spin_gate_events_deg against the angle
     recorded at every flown encounter. The catalogue payload is fetched before any tab, and
     setCat() takes the epoch, the spin line and the Sun table from it. */
  var SPIN0=0,SPINR=TAU*1.00273781,SUNG=null,SUNSTEP=1.0;
  function setCat(c){
    CAT=c||null;
    EPOCH=(CAT&&CAT.meta&&CAT.meta.epoch)||EPOCH; EPOCH_MS=Date.parse(EPOCH+"Z");
    SPIN0=(CAT&&CAT.spin)?CAT.spin[0]:0; SPINR=(CAT&&CAT.spin)?CAT.spin[1]:TAU*1.00273781;
    SUNG=(CAT&&CAT.sun)?CAT.sun:null; SUNSTEP=(CAT&&CAT.sun_step_d)||1.0;
  }
  /* one full turn of the Earth per second of real time -- past that the spin is aliasing, not
     motion: at 60 Hz it is already 6 degrees a frame, and the surface strobes rather than turns */
  var SPIN_CAP=86400/1.0027379, SPIN_HELD=false, SPIN_AT=0;
  function sunAt(T,out){
    if(!SUNG){out[0]=1;out[1]=0;out[2]=0;return out;}
    var f=Math.max(0,Math.min(SUNG.length-1.0001,T/SUNSTEP)),i=Math.floor(f),u=f-i;
    var a=SUNG[i],b=SUNG[i+1];
    out[0]=a[0]+(b[0]-a[0])*u;out[1]=a[1]+(b[1]-a[1])*u;out[2]=a[2]+(b[2]-a[2])*u;
    return out;
  }

  /* ====================================================================================
     ONE DISPLAY FUNCTION.
     A TRACK is the time-ordered list of flown states of one body: at each state, the six
     osculating elements Orekit derived from it and that orbit's Keplerian period.
     stateAt(track,T) is defined for every T and is continuous everywhere:
        elements  linear between the two bracketing flown states, angles on the short arc
        phase     the earlier state's true anomaly carried FORWARD at its own Keplerian
                  rate and the later state's carried BACK at its own, blended -- exact at
                  both flown states, continuous across every boundary, and still right for
                  a track holding a single state.
     Inspectors, targets and the catalogue all go through it, so no arm has a display path
     of its own and there is nothing left to keep in step.
     ==================================================================================== */
  function track(states){                       // states: [{t, el:[6], per}] ascending in t
    return {t:states.map(function(s){return s.t;}),
            el:states.map(function(s){return s.el;}),
            per:states.map(function(s){return s.per;}),
            n:states.length, c:0};
  }
  function bracket(tr,T){
    var t=tr.t,n=tr.n,c=tr.c;
    if(c>=n)c=n-1;
    while(c>0&&t[c]>T)c--;
    while(c<n-1&&t[c+1]<=T)c++;
    tr.c=c;return c;
  }
  function stateAt(tr,T,out){
    var j=bracket(tr,T),n=tr.n;
    var A=j, B=(T>=tr.t[j]&&j<n-1)?j+1:j;
    var tA=tr.t[A],tB=tr.t[B];
    var u=(B!==A&&tB>tA)?Math.max(0,Math.min(1,(T-tA)/(tB-tA))):0;
    var eA=tr.el[A],eB=tr.el[B],o=out.el;
    o[0]=eA[0]+(eB[0]-eA[0])*u;
    o[2]=eA[2]+arc(eB[2]-eA[2])*u;                       // inclination
    o[3]=eA[3]+arc(eB[3]-eA[3])*u;                       // node
    /* Eccentricity and perigee argument are carried as the eccentricity VECTOR, e(cos w, sin w).
       At e < 0.002 the perigee argument is not a real direction: between two osculating states a
       second apart it can swing 100 degrees, and interpolating it on its own spins the true anomaly
       the other way to compensate, which leaves the radius oscillating at kilometres a second. The
       two components are small, well behaved, and reproduce e and w exactly at both ends. */
    var ex=eA[1]*Math.cos(eA[4]),ey=eA[1]*Math.sin(eA[4]);
    ex+=(eB[1]*Math.cos(eB[4])-ex)*u; ey+=(eB[1]*Math.sin(eB[4])-ey)*u;
    o[1]=Math.sqrt(ex*ex+ey*ey); o[4]=Math.atan2(ey,ex);
    /* The phase carried across an interval is the ARGUMENT OF LATITUDE, perigee argument plus
       true anomaly -- never the true anomaly alone. Every orbit here has e < 0.002, so between two
       osculating states the perigee argument can swing by radians while the body barely moves, and
       the true anomaly swings back to cancel it. Blending the two separately puts that cancellation
       into the phase rate and the body lurches at each boundary; their sum is the angle from the
       ascending node and is well behaved. */
    var LA=eA[4]+eA[5]+TAU*(T-tA)*86400/tr.per[A];
    var LB=eB[4]+eB[5]+TAU*(T-tB)*86400/tr.per[B];
    var dp=arc(LB-LA);
    o[5]=LA+dp*u-o[4];
    out.per=tr.per[A]+(tr.per[B]-tr.per[A])*u;
    out.inside=(T>=tr.t[0]-1e-9&&T<=tr.t[n-1]+1e-9);
    return out;
  }

  /* --- the ellipse, written straight into scene-space buffers, no per-frame allocation --- */
  var RK=[0,0,0,0,0,0];                                       // Px,Py,Pz,Qx,Qy,Qz
  function basis(e){
    var i=e[2],O=e[3],w=e[4];
    var cO=Math.cos(O),sO=Math.sin(O),ci=Math.cos(i),si=Math.sin(i),cw=Math.cos(w),sw=Math.sin(w);
    RK[0]=cO*cw-sO*sw*ci; RK[1]=sO*cw+cO*sw*ci; RK[2]=sw*si;
    RK[3]=-cO*sw-sO*cw*ci; RK[4]=-sO*sw+cO*cw*ci; RK[5]=cw*si;
  }
  function atNu(e,nu,arr,o){                                  // scene coords: (x, z, -y)/1000

    /* Engine line.  While a burn is displayed: state, sign, thrust, this arc's duration, the dv of the

    /* ============ the encounter inset: ONE picture for all four tabs (PH 2026-09-30) ============

                                          frame at v_rel, closest approach on the vertical through the platform
         co-orbit (tour legs, fleet serves) horizontal = the target's along-track, vertical = radial; the line is
                                          the RECORDED relative track over the encounter window (e.rel rows
                                          [s from arrival, along, radial, cross] m, chaser − target: the target

       It shows the LAST encounter (idx) and is static outside its window: nothing is redrawn between encounters
       (the SVG is byte-stable).  Inside a window it moves, at most every 100 ms of real time:
         fly-by   |T − tca| ≤ halfKm / v_rel      target at v·(T − tca) along the line, closest approach fixed

    var COORB=(MODE==="tour"||MODE==="fleet"),insetLiveOn=false,lastInset=0,relCur={relC:0};

    /* ------------- timeline: also the scrub bar for the one clock ------------- */
    function timeline(){

    /* coverage accumulation (survey): every plotted point is a real (day, count) pair */

  function setLoad(txt,err){var n=el("loadline");if(!n)return;n.textContent=txt||"";n.className="loadline"+(err?" err":"");}
  function activate(k,who,keepT,carried){

       "*" mode as "" without forgetting it) */

      el("arms").querySelectorAll("button").forEach(function(b){

      CUR=null;
      var A=buildArm(D,{tab:k,who:who||"",insp:INSP[k]||[],wing:WING[k]||null,keepT:!!keepT});
      CUR=A;
      var m=A.meta,man=MAN||{};
      el("prov").innerHTML="<b>"+(m.tag||"")+"</b> · run "+(m.run||"—")+
        (m.git?" · commit "+(String(m.git).indexOf(" ")<0?String(m.git).slice(0,10):String(m.git)):"")+
        (m.catalogue?" · catalogue sha12 "+m.catalogue:"")+
        (man.code_commit?" · page code commit "+String(man.code_commit).slice(0,10):"")+
        (man.built_utc?" · built "+man.built_utc:"")+(man.doi?" · archived: doi:"+man.doi+" (https://doi.org/"+man.doi+", data/README.md)":"")+" — "+A.prov+
        " Imagery: NASA Blue Marble and Earth at Night, public domain.";

      el("title").textContent="This view failed to draw";
      el("eyebrow").textContent=String(err&&err.message||err);
      throw err;
    }

     more than one fleet), else the carried MODE -- "*" only where the tab has an S1 arm to show (a fleet tab's
     "all platforms" is ""); the mode itself is kept, so it comes back on the next tab that has it */
  function carryWho(k){
    var D=DATA[k];if(!D)return "";

    if(w&&(ins.some(function(P){return P.meta.inspector===w;})||D.events.some(function(e){return (e.who||"")===w;})))return w;
    var m=SEL.mode||"";
    if(m==="*"&&!(TAB[k]&&TAB[k].wing&&ins.length))m="";

  /* fetch one JSON file; a failure is reported (header line + console), never swallowed */
  var FAILED=[];

  function loadTab(k){
    var t=TAB[k]; if(!t)return Promise.reject(new Error("no tab "+k));

    if(W&&W.fleet)files.push({id:"p-"+k+"-wing",url:W.fleet,role:"wing"});
    var insp=(t.inspectors||(W&&W.inspectors)||[]);
    insp.forEach(function(s,i){files.push({id:"p-"+k+"-insp-"+i,url:s.file,role:"insp",spec:s});});
    var done=0,total=files.length,bt=el("arms").querySelector('button[data-arm="'+k+'"]');   /* NodeList has no .find in a browser */
    if(bt)bt.disabled=true;

      return getJSON(f.url).then(function(obj){
        if(f.role==="insp"){
          if(!obj||!obj.meta||obj.meta.kind!=="tour")throw new Error(f.url+" is not a tour payload (meta.kind "+(obj&&obj.meta&&obj.meta.kind)+")");
          if(f.spec.id&&obj.meta.inspector!==f.spec.id)throw new Error(f.url+": meta.inspector "+obj.meta.inspector+" != manifest id "+f.spec.id);
          obj.meta.dev=!!f.spec.dev; obj.meta.file=f.url;
          if(f.spec.keepout_m!==undefined&&(obj.meta.keepout_m===undefined||obj.meta.keepout_m===null))obj.meta.keepout_m=f.spec.keepout_m;
        }
        feed(f.id,obj); done++;
        if(f.role==="arm"&&bt)bt.disabled=false;
        setLoad("loading "+t.label+": "+done+" / "+total+" files");
        return obj;
      });
    })).then(function(){
      DATA[k]=load("p-"+k);
      INSP[k]=insp.map(function(_,i){return load("p-"+k+"-insp-"+i);}).filter(function(P){return !!P;});
      WING[k]=W?{meta:(W.fleet?(load("p-"+k+"-wing")||{}).meta:null)||null,events:(W.fleet&&(load("p-"+k+"-wing")||{}).events)||[],spec:W}:null;
      if(WING[k]&&WING[k].meta&&W.case&&!WING[k].meta.case)WING[k].meta.case=W.case;
      if(!DATA[k])throw new Error("arm payload missing for "+k);
      setLoad(FAILED.length?FAILED.length+" file(s) failed: "+FAILED.join("; "):"",FAILED.length>0);
      if(bt)bt.disabled=false;
    }).catch(function(err){
      LOADED[k]=null;
      setLoad("FAILED to load "+t.label+": "+err.message,true);
      if(bt)bt.disabled=false;
      throw err;
    });
    return LOADED[k];
  }
  function menu(){
    el("arms").innerHTML=TABS.map(function(t){
      return '<button data-arm="'+t.id+'" aria-pressed="false">'+t.label+'</button>';}).join("");
    el("arms").querySelectorAll("button").forEach(function(b){
      b.onclick=function(){var k=b.dataset.arm;return loadTab(k).then(function(){switchTab(k);});};});
  }
  function boot(){
    return getJSON("manifest.json").then(function(man){
      MAN=man; TABS=man.tabs||[]; TABS.forEach(function(t){TAB[t.id]=t;});
      if(man.dev){var d=el("devtag");if(d){d.hidden=false;d.textContent=man.dev_note||"DEV DATA";}}
      return getJSON(man.catalogue).then(function(c){setCat(c);feed("p-cat",c);},function(){setCat(null);});
    }).then(function(){
      menu();
      if(typeof THREE==="undefined"){el("c-day").textContent="—";el("c-sub").textContent="3-D view unavailable";}
      if(!TABS.length){el("title").textContent="No tabs in the manifest";return;}
      return loadTab(TABS[0].id).then(function(){activate(TABS[0].id);});
    }).catch(function(err){
      setLoad("FAILED: "+err.message,true);
      el("title").textContent="The atlas could not load";
      el("eyebrow").textContent=String(err&&err.message||err);
      throw err;
    });
  }
  var READY=boot();

  /* Test hook: `module` does not exist in the browser, so this is inert there. It lets
     check_display.js gate THE PAGE'S OWN display function -- not a copy of it -- against the
     flown states and for continuity across every encounter boundary, and check_atlas.js drive
     the page's own frames. */
  if(typeof module!=="undefined"&&module.exports)
    module.exports={track:track,stateAt:stateAt,basis:basis,atNu:atNu,RK:RK,
                    tOf:tOf,spinAt:function(T){return SPIN0+SPINR*T;},sunAt:sunAt,DATA:DATA,INSP:INSP,WING:WING,
                    cat:function(){return CAT;},man:function(){return MAN;},tabs:function(){return TABS;},
                    anchor:anchor,CLK:CLK,sky:function(){return SKY;},activate:activate,loadTab:loadTab,switchTab:switchTab,carryWho:carryWho,
                    sel:function(){return {mode:SEL.mode,who:SEL.who,showCat:SHOWCAT,subtab:SUBTAB};},
                    cur:function(){return CUR;},ready:READY,feed:feed,load:load,failed:FAILED};
})();
</script>
